version: '3.8'

services:
  # ChatPDF Streamlit Application
  chatpdf:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatpdf-app
    ports:
      - "8501:8501"
    volumes:
      # Persist data directory
      - ./data:/app/data
      # Persist logs
      - ./logs:/app/logs
    environment:
      # Application
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0

      # OpenAI Configuration (from host .env)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_ORG_ID=${OPENAI_ORG_ID:-}

      # Ollama Configuration (connect to ollama service)
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_TIMEOUT=120

      # HuggingFace Configuration
      - HF_API_KEY=${HF_API_KEY:-}
      - HF_CACHE_DIR=/app/data/models/huggingface

      # File Storage
      - UPLOAD_FOLDER=/app/data/uploads
      - MAX_FILE_SIZE=50
      - ALLOWED_EXTENSIONS=pdf,docx,txt,md

      # Vector Store
      - VECTOR_STORE_TYPE=faiss
      - VECTOR_STORE_PATH=/app/data/vector_stores
      - EMBEDDING_MODEL=text-embedding-ada-002
      - EMBEDDING_DIMENSION=1536

      # RAG Configuration
      - CHUNK_SIZE=1000
      - CHUNK_OVERLAP=200
      - TOP_K_RETRIEVAL=10
      - USE_RERANKING=True
      - USE_COMPRESSION=False

      # LLM Defaults
      - DEFAULT_MODEL=gpt-3.5-turbo
      - DEFAULT_TEMPERATURE=0.7
      - DEFAULT_MAX_TOKENS=500

      # Logging
      - LOG_LEVEL=INFO
      - LOG_FILE=/app/logs/app.log

    networks:
      - chatpdf-network

    depends_on:
      - ollama

    restart: unless-stopped

    # Resource limits (optional, adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # Ollama Service for Local LLMs
  ollama:
    image: ollama/ollama:latest
    container_name: chatpdf-ollama
    ports:
      - "11434:11434"
    volumes:
      # Persist Ollama models
      - ollama-models:/root/.ollama

    networks:
      - chatpdf-network

    restart: unless-stopped

    # Resource limits for Ollama (GPU optional)
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

    # Uncomment below if you have NVIDIA GPU support
    # runtime: nvidia
    # environment:
    #   - NVIDIA_VISIBLE_DEVICES=all

volumes:
  # Named volume for Ollama models
  ollama-models:
    driver: local

networks:
  chatpdf-network:
    driver: bridge
